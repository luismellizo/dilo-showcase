# CI del snapshot público de DILO.
#
# Solo verificación: checks de Django, guardia de deriva de migraciones, tests
# y build del frontend. El repo privado tiene además un job de despliegue que
# publica los cuatro servicios (backend, worker, beat, frontend); aquí se omite
# a propósito — este snapshot está congelado y no se despliega a ninguna parte.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-dummy-key-not-for-prod
      DEBUG: "True"
      DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migration drift guard
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests (pytest + coverage)
        run: pytest
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm install (no ci): el lock generado por npm 11 local no satisface
      # el grafo de npm 10 — mismo camino de instalacion que el Dockerfile.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: ESLint
        run: npx eslint src/
      - name: Build
        run: CI=true npm run build

# Nota sobre el despliegue
# ------------------------
# El repo privado tiene aquí un tercer job que, tras pasar backend y frontend,
# redespliega los CUATRO servicios de una sola vez: backend, worker de Celery,
# beat y frontend.
#
# El detalle de diseño que importa: al principio solo se disparaba el backend, y
# el frontend seguía servido con el bundle anterior. Un despliegue parcial es
# peor que ninguno — la SPA queda hablando con una API que ya cambió de
# contrato. Por eso un push a main los mueve a los cuatro o a ninguno.
#
# Ese job no existe en este snapshot: está congelado y no se despliega a
# ninguna parte.
