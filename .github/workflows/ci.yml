name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-dummy-key-not-for-prod
      DEBUG: "True"
      DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migration drift guard
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests (pytest + coverage)
        run: pytest
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm install (no ci): el lock generado por npm 11 local no satisface
      # el grafo de npm 10 — mismo camino de instalacion que el Dockerfile.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: ESLint
        run: npx eslint src/
      - name: Build
        run: CI=true npm run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      # Un solo push a main redespliega los CUATRO servicios: backend, worker
      # de Celery, beat y frontend. Antes solo se disparaba el backend y el
      # frontend quedaba servido con el bundle viejo — un despliegue parcial
      # es peor que ninguno, porque la SPA habla con una API que ya cambió.
      #
      # ⚠️ Identificadores de las apps y proveedor de deploy omitidos en este
      #    snapshot público. En el repo privado son 4 UUIDs fijos.
      APP_IDS: >-
        app-backend
        app-worker
        app-beat
        app-frontend
    steps:
      - name: Trigger deployments (backend, worker, beat, frontend)
        if: env.DEPLOY_URL != '' && env.DEPLOY_TOKEN != ''
        run: |
          for id in $APP_IDS; do
            echo "Deploying $id"
            curl -fsS --retry 3 \
              -H "Authorization: Bearer $DEPLOY_TOKEN" \
              "$DEPLOY_URL/api/v1/deploy?uuid=$id&force=false"
          done
      - name: Secrets missing notice
        if: env.DEPLOY_URL == '' || env.DEPLOY_TOKEN == ''
        run: echo "::warning::DEPLOY_URL / DEPLOY_TOKEN sin configurar — deploy omitido (CI verde igual)"
