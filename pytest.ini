[pytest]
DJANGO_SETTINGS_MODULE = whatsapp_orders.settings
python_files = test_*.py tests.py
# Solo la suite unitaria/integracion con DB de test (mockea LLM/WhatsApp/Telegram).
# Los scripts de humo de la raiz (test_ai.py, test_bot_conversations.py, ...)
# necesitan servidor vivo + API real -> NO corren aqui ni en CI.
testpaths = orders/tests
addopts = -q --reuse-db --cov=orders --cov-report=term-missing --cov-report=xml
