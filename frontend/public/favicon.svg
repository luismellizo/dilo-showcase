<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon de DILO — versión CIRCULAR del isotipo.

  Va aparte de `bimi-dilo.svg` a propósito: BIMI **exige lienzo cuadrado**, así
  que ese archivo no se puede redondear sin romper el logo del correo. Este es
  su gemelo para la pestaña del navegador, donde el círculo se ve mejor porque
  no compite con los favicons cuadrados del resto de pestañas.

  Los puntos van un pelo más gruesos que en el logo original (r=2.8 en vez de
  2.4): a 16px un punto de 2.4 se convierte en un píxel gris sucio.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>DILO</title>

  <circle cx="256" cy="256" r="256" fill="#FF441F"/>

  <!-- Burbuja de chat en blanco, centrada dentro del círculo con margen. -->
  <g transform="translate(80,76) scale(8.8)">
    <path fill="#FFFFFF"
          d="M20 4C10.6 4 3 10.9 3 19.4c0 3.9 1.6 7.5 4.3 10.2-.3 2.4-1.1 4.5-2.4 6.1-.5.6-.1 1.5.7 1.4 3.3-.3 5.9-1.5 7.8-2.8 2 .7 4.2 1.1 6.6 1.1 9.4 0 17-6.9 17-15.4S29.4 4 20 4Z"/>
    <circle cx="13" cy="19" r="2.8" fill="#FF441F"/>
    <circle cx="20" cy="19" r="2.8" fill="#FF441F"/>
    <circle cx="27" cy="19" r="2.8" fill="#FF441F"/>
  </g>
</svg>
