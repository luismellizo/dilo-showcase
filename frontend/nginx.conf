# Backend deployado como app separada en el PaaS (no comparte red de compose
# con la app "backend" por nombre) → se proxea a su dominio público.
# BACKEND_ORIGIN se sustituye en build/runtime vía envsubst (ver Dockerfile).
# DEBE ser https://<dominio-real-con-cert> (no el sslip por HTTP plano):
# un BACKEND_ORIGIN http:// hace que este proxy vuelva a entrar a Traefik
# por su entrypoint HTTP — Traefik normaliza X-Forwarded-Proto según CADA
# entrypoint que atraviesa, así que ese segundo hop lo pisa a "http" sin
# importar lo que mande este nginx, y Django (SECURE_SSL_REDIRECT) redirige
# en bucle. Con https:// el segundo hop entra por el entrypoint HTTPS real
# de Traefik, que sí preserva el esquema correcto.
map $http_x_forwarded_proto $client_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s;
    set $backend_origin "${BACKEND_ORIGIN}";

    location /api/ {
        proxy_pass $backend_origin;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass $backend_origin;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location /media/ {
        proxy_pass $backend_origin;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
